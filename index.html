<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cc0033" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/escudo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Casino" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!--SEO-->
    <!--JSONLD-->
    <script>
      // Aplica el tema elegido antes de pintar (evita el parpadeo claro/oscuro)
      try {
        var t = localStorage.getItem('casino-tema')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Para ver el sitio del Club Deportivo Casino necesitás activar JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
